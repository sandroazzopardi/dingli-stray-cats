<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dingli Stray Cats | Dingli, Malta</title>

    <link rel="icon" type="image/JPG" href="DingliCats_FAV.JPG">

    <meta name="description" content="Dingli Stray Cats — A community dedicated to the stray cat colonies in Dingli, Malta. Together we can help, protect, and care for them.">

    <meta name="keywords" content="Dingli Stray Cats, stray cats Dingli, cats Dingli Malta, stray cats Malta, Dingli Malta, animal care, love for animals, volunteer feeders, fundraising, TNR, Trap Neuter Return, rescue, shelter, rehoming, managing colony, cat colonies, veterinary care, developed by Sandro Azzopardi sandroazzopardi.com">

    <meta name="author" content="Dingli Stray Cats">
   
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            width: 220px;
            max-width: 70%;
            height: auto;
            margin-bottom: 35px;
        }

        .message {
            max-width: 650px;
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 35px;
             color: #5B9FF5;
        }

        .facebook {
            display: inline-block;
            padding: 14px 28px;
            background: #1877F2;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .facebook:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            font-size: 14px;
            color: #888888;
        }

        @media (max-width: 600px) {
            main {
                padding: 30px 20px;
            }

            .logo {
                width: 180px;
                margin-bottom: 30px;
            }

            .message {
                font-size: 19px;
                line-height: 1.55;
                margin-bottom: 30px;
            }

            .facebook {
                font-size: 16px;
                padding: 13px 24px;
            }

            footer a,
footer a:hover,
footer a:visited {
    color: #888888;
}
        }
    </style>
</head>

<body>

    <main>

        <img src="Dingli Stray Cats Logo New.png" alt="Dingli Stray Cats Logo" class="logo">

        <p class="message">
            A community dedicated to the stray cat colonies in Dingli, Malta 🐱
            <br>
            Together we can help, protect, and care for them.
        </p>

        <a
            href="https://www.facebook.com/dinglistraycats"
            target="_blank"
            rel="noopener noreferrer"
            class="facebook">
            Follow us on Facebook
        </a>

        <div id="facebook-feed">
    <p>Loading Facebook posts...</p>
</div>

<style>
#facebook-feed {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1100px;
    margin: 30px auto;
}

.facebook-post {
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
}

.facebook-post img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
}

.facebook-post-content {
    padding: 15px;
}

.facebook-post-text {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.facebook-post-date {
    font-size: 12px;
    color: #777;
    margin-bottom: 10px;
}

.facebook-post a {
    font-size: 13px;
    color: #1877f2;
    text-decoration: none;
}

@media (max-width: 700px) {
    #facebook-feed {
        grid-template-columns: 1fr;
    }
}
</style>

      <script>
async function loadFacebookFeed() {
    const feed = document.getElementById("facebook-feed");

    try {
        const response = await fetch(
            "https://dingli-stray-cats-feed.sandroazzopardi.workers.dev/"
        );

        const posts = await response.json();

        feed.innerHTML = "";

        posts.forEach(post => {
            const article = document.createElement("article");
            article.className = "facebook-post";

            let content = "";

            if (post.image) {
                content += `
                    <img src="${post.image}" alt="Dingli Stray Cats">
                `;
            }

            content += `<div class="facebook-post-content">`;

            if (post.text) {
                content += `
                    <div class="facebook-post-text">
                        ${post.text}
                    </div>
                `;
            }

            if (post.date) {
                const date = new Date(post.date);

                content += `
                    <div class="facebook-post-date">
                        ${date.toLocaleDateString()}
                    </div>
                `;
            }

            if (post.link) {
                content += `
                    <a href="${post.link}" target="_blank" rel="noopener">
                        View on Facebook
                    </a>
                `;
            }

            content += `</div>`;

            article.innerHTML = content;
            feed.appendChild(article);
        });

    } catch (error) {
        feed.innerHTML =
            "<p>Unable to load Facebook posts.</p>";
        console.error(error);
    }
}

loadFacebookFeed();
</script>
    </main>

    <footer>
        © 2026 Dingli Stray Cats<br>
    <a href="https://www.sandroazzopardi.com" target="_blank" rel="noopener noreferrer">
        www.sandroazzopardi.com
    </a>  
    </footer>

</body>
</html>
