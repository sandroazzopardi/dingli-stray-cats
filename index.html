<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dingli Stray Cats | Dingli, Malta</title>

    <link rel="icon" type="image/JPG" href="DingliCats_FAV.JPG">

    <meta name="description" content="Dingli Stray Cats — A community dedicated to the stray cat colonies in Dingli, Malta. Together we can help, protect, and care for them.">

    <meta name="keywords" content="Dingli Stray Cats, stray cats Dingli, cats Dingli Malta, stray cats Malta, Dingli Malta, animal care, love for animals, volunteer feeders, fundraising, TNR, Trap Neuter Return, managing colony, cat colonies, veterinary care">

    <meta name="author" content="Dingli Stray Cats">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            width: 220px;
            max-width: 70%;
            height: auto;
            margin-bottom: 35px;
        }

        .message {
            max-width: 650px;
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 35px;
             color: #5B9FF5;
        }

        .facebook {
            display: inline-block;
            padding: 14px 28px;
            background: #1877F2;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .facebook:hover {
            opacity: 0.85;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            font-size: 14px;
            color: #888888;
        }

        @media (max-width: 600px) {
            main {
                padding: 30px 20px;
            }

            .logo {
                width: 180px;
                margin-bottom: 30px;
            }

            .message {
                font-size: 19px;
                line-height: 1.55;
                margin-bottom: 30px;
            }

            .facebook {
                font-size: 16px;
                padding: 13px 24px;
            }
        }
    </style>
</head>

<body>

    <main>

        <img src="Dingli Stray Cats Logo New.png" alt="Dingli Stray Cats Logo" class="logo">

        <p class="message">
            A community dedicated to the stray cat colonies in Dingli, Malta 🐱
            <br>
            Together we can help, protect, and care for them.
        </p>

        <a
            href="https://www.facebook.com/dinglistraycats"
            target="_blank"
            rel="noopener noreferrer"
            class="facebook">
            Follow us on Facebook
        </a>

    </main>

    <footer>
        © 2026 Dingli Stray Cats
    </footer>

</body>
</html>
